name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 生成源码
        run: |
          set -e
          mkdir -p app
          echo '' | base64 -d > app/build.gradle
          mkdir -p app/src/main
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/java/com/dsh/overtime
          echo '' | base64 -d > app/src/main/java/com/dsh/overtime/MainActivity.java
          mkdir -p app/src/main/java/com/dsh/overtime
          echo '' | base64 -d > app/src/main/java/com/dsh/overtime/Record.java
          mkdir -p app/src/main/java/com/dsh/overtime
          echo '' | base64 -d > app/src/main/java/com/dsh/overtime/Store.java
          mkdir -p app/src/main/res/drawable
          echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.xml
          mkdir -p app/src/main/res/layout
          echo '' | base64 -d > app/src/main/res/layout/activity_main.xml
          mkdir -p app/src/main/res/layout
          echo '' | base64 -d > app/src/main/res/layout/dialog_add.xml
          mkdir -p app/src/main/res/layout
          echo '' | base64 -d > app/src/main/res/layout/item_record.xml
          mkdir -p app/src/main/res/values
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuiusOWKoOePrTwvc3RyaW5nPgo8L3Jlc291cmNlcz4K' | base64 -d > app/src/main/res/values/strings.xml
          mkdir -p app/src/main/res/values
          echo '' | base64 -d > app/src/main/res/values/themes.xml
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNS4yJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
          echo 'YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCm9yZy5ncmFkbGUuanZtYXJncz0tWG14MmcgLURmaWxlLmVuY29kaW5nPVVURi04Cg==' | base64 -d > gradle.properties
          echo '' | base64 -d > settings.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: overtime-apk
          path: app/build/outputs/apk/debug/*.apk
